name: Infer Android Build

env:
  FLUTTER_VERSION: '3.47.6'

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/infer-android.yml'

jobs:
  android:
    name: Build Infer APK
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Inject fallback secret
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: Resolve version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | sed 's/version: //' | tr -d ' ')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "VERSION=${VERSION}_${SHORT_SHA}" >> $GITHUB_ENV
          echo "Building ${VERSION}_${SHORT_SHA}"

      - name: Write signing keystore
        if: ${{ env.SIGN_KEYSTORE_BASE64 != '' }}
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          echo "storeFile=key.jks" >> android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          for file in app-*-release.apk; do
            abi=$(echo "$file" | sed -E 's/app-(.*)-release\.apk/\1/')
            mv "$file" "Infer_android_${VERSION}_${abi}.apk"
          done
          ls -lh *.apk

      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: Infer-arm64-v8a
          path: build/app/outputs/flutter-apk/Infer_android_*_arm64-v8a.apk
          if-no-files-found: warn

      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: Infer-armeabi-v7a
          path: build/app/outputs/flutter-apk/Infer_android_*_armeabi-v7a.apk
          if-no-files-found: warn

      - name: Upload universal (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: Infer-all-apis
          path: build/app/outputs/flutter-apk/Infer_android_*.apk
          if-no-files-found: warn
