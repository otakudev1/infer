name: Infer Android Build

env:
  FLUTTER_VERSION: '3.47.6'

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/infer-android.yml'

jobs:
  android:
    name: Build Infer APK
    runs-on: ubuntu-24.04-arm
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: /opt/flutter
          key: flutter-${{ env.FLUTTER_VERSION }}-linux-arm64-v1

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          # The ubuntu-24.04-arm image ships without the Android SDK.
          # cmdline-tools is Java-based, so its linux_x64 build runs fine here.
          SDK="$HOME/android-sdk"
          if [ ! -d "$SDK/cmdline-tools/latest" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            rm -f /tmp/cmdline-tools.zip
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Flutter (arm64)
        shell: bash
        run: |
          set -euo pipefail
          # subosito/flutter-action resolves versions from releases_linux.json,
          # which lists x64 archives only, so it fails on arm64 with
          # "Unable to determine Flutter version ... architecture: arm64".
          # The per-engine-hash arm64 artifacts do exist on the CDN, so clone
          # the tagged SDK and let update_dart_sdk.sh pick arm64 via uname -m.
          if [ ! -x /opt/flutter/bin/flutter ]; then
            sudo git clone --depth 1 --branch "${{ env.FLUTTER_VERSION }}" \
              https://github.com/flutter/flutter.git /opt/flutter
            sudo chown -R "$(id -u):$(id -g)" /opt/flutter
          fi
          git config --global --add safe.directory /opt/flutter
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"
          export PATH="/opt/flutter/bin:$PATH"
          flutter --version
          flutter config --no-analytics
          dart --version

      - name: Inject fallback secret
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: Resolve version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | sed 's/version: //' | tr -d ' ')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "VERSION=${VERSION}_${SHORT_SHA}" >> $GITHUB_ENV
          echo "Building ${VERSION}_${SHORT_SHA}"

      - name: Write signing keystore
        if: ${{ env.SIGN_KEYSTORE_BASE64 != '' }}
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          echo "storeFile=key.jks" >> android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk "Infer_android_${VERSION}_arm64-v8a.apk"
          ls -lh *.apk

      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: Infer-arm64-v8a
          path: build/app/outputs/flutter-apk/Infer_android_*_arm64-v8a.apk
          if-no-files-found: error
